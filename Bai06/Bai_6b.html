<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="Bai_6b.css">

</head>
<body>

    <from>
        <div class="contact_us">
            <div class="my_contact_us">
                <h1 id="title">Contact Us</h1>
                <div class="your_message">
                    <p class="p_your_message">Your message:</p><br>
                    <div class="message_group">

                        <label for="to" class="my_to">To</label>
                        <input type="text" name="to" id="to" placeholder="Example Cafe"><br>

                        <label for="email" class="my_email">Your email</label>
                        <input type="email" name="email" id="email" required><br>

                        <label for="message" class="my_message">Message</label>
                        <textarea name="message" id="message" cols="30" rows="7"></textarea><br>
                        
                        <label for="file">Attach File</label>
                        <input type="file" name="file" id="file">
                    </div>
                </div>

                <div class="found">
                    <p class="p_your_found">How you found us:</p><br>
                    <div class="message_group">

                        <label for="hear" class="my_hear">How did you hear of us</label>
                        <select name="hear" id="hear">
                            <option value="1">Google</option>
                            <option value="2">Chrome</option>
                            <option value="3">Yahoo</option>
                            
                        </select><br>

                        <label for="Newsletter" class="my_Newsletter">Newsletter</label>
                        <input type="checkbox" name="Newsletter" id="my_checkbox" required checked>
                        <label for="my_checkbox">Ensure this box is checked if you would like to receive email updates</label>                    
                    </div>
                </div>

                <input type="submit" value="Send message">
            </div> 
        </div>      
    </form>
    
    
    
</body>
</html>
